name: Validate engineering suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r skills/software-engineering/scripts/requirements-maintenance.txt
      - run: python scripts/check.py
      - run: python scripts/run_tests.py
