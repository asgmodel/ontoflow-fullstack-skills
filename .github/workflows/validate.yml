name: Validate engineering suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      ONTOLINK_SKILL_ROOT: ${{ runner.temp }}/ontolink-upstream/skills/ontolink-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Load current external OntoLink outside the checkout
        run: git clone --depth 1 https://github.com/asgmodel/ontolink-skills.git "$RUNNER_TEMP/ontolink-upstream"
      - run: python -m pip install -r skills/software-engineering/scripts/requirements-maintenance.txt
      - run: python scripts/check.py
      - run: python scripts/run_tests.py
